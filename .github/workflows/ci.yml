name: Run tests

on:
  push:
    paths-ignore: ["**.md", LICENSE]
  pull_request:
    paths-ignore: ["**.md", LICENSE]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        variant: [default, large-strings, advanced-logging]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup NSIS
        id: nsis
        uses: ./
        with:
          large-strings: ${{ matrix.variant == 'large-strings' }}
          advanced-logging: ${{ matrix.variant == 'advanced-logging' }}

      - name: Check outputs, env and build flags
        shell: bash
        env:
          LARGE: ${{ matrix.variant == 'large-strings' }}
          LOG: ${{ matrix.variant == 'advanced-logging' }}
          OUT_VERSION: ${{ steps.nsis.outputs.version }}
          OUT_NSISDIR: ${{ steps.nsis.outputs.nsisdir }}
        run: |
          set -euo pipefail
          [ -n "$OUT_VERSION" ]
          [ "$OUT_NSISDIR" = "$NSISDIR" ]
          [ -f "$NSISDIR/Include/MUI2.nsh" ]

          # Unqualified: proves the action put the bin dir on PATH
          info=$(makensis -HDRINFO)

          strlen=8192
          [ "$LARGE" = "true" ] || strlen=1024
          grep -q "NSIS_MAX_STRLEN=$strlen" <<< "$info"

          if [ "$LOG" = "true" ]; then
            grep -q "NSIS_CONFIG_LOG" <<< "$info"
          else
            ! grep -q "NSIS_CONFIG_LOG" <<< "$info"
          fi

      - name: Compile a script
        shell: bash
        run: |
          set -euo pipefail
          cat > test.nsi <<'EOF'
          OutFile "test.exe"
          Name "test"
          Section
            DetailPrint "hello"
          SectionEnd
          EOF
          makensis test.nsi
          [ -f test.exe ]

  windows-combo-rejected:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup NSIS with both special builds
        id: nsis
        continue-on-error: true
        uses: ./
        with:
          large-strings: true
          advanced-logging: true

      - name: Check the step failed
        shell: bash
        run: '[ "${{ steps.nsis.outcome }}" = failure ]'

  pinned-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup NSIS
        id: nsis
        uses: ./
        with:
          version: "3.10"

      - name: Check the pinned version was used
        shell: bash
        run: '[ "${{ steps.nsis.outputs.version }}" = "3.10" ] && makensis -VERSION | grep -q 3.10'
